name: ci

on:
  push:
    branches: [main]
  pull_request:

# Read-only by default; elevate per job only if a job needs it.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Pinned to a full commit SHA (actions/checkout v7.0.1), not a mutable tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # The runner image ships Go, and go.mod's version triggers a matching toolchain
      # download. TODO: add actions/setup-go pinned to a verified commit SHA.
      - run: make ci
